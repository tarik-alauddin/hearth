name: Agent release

# Every merge to main that changes the agent publishes a release, versioned by date and commit
# (e.g. 2026.10.01-3f2a9c1): harness-tested, uploaded to the releases bucket, tagged
# agent-<version> with a GitHub Release, and placed on dev's canary. "Promote agent" then puts any
# release on any channel in any environment. Old releases that no channel needs are pruned.
# Run by hand to cut a release without an agent change.
on:
  push:
    branches: [main]
    paths: ["agent/**"]
  workflow_dispatch:

permissions:
  contents: write # the tag and GitHub Release
  id-token: write

concurrency:
  group: agent-release
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT: "138300868928"
  BUCKET: hearth-agent-releases-138300868928

jobs:
  release:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 40
    defaults:
      run:
        working-directory: agent
    steps:
      # "Run workflow" offers a branch picker (which copy of this file runs); only main's may run.
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        working-directory: . # agent/ doesn't exist before checkout
        run: |
          echo "::error::Run this workflow from main, not ${GITHUB_REF_NAME}."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Version
        id: version
        run: echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - run: go vet -tags harness ./...
      - run: go test -race ./...
      - name: Harness (real agent, Minecraft container, mock API)
        run: go test -tags harness -timeout 30m ./harness/
      - name: Build
        run: ./build.sh "${{ steps.version.outputs.version }}"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT }}:role/github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload and point dev's canary at it
        id: upload
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          key="agent/$VERSION/hearth-agent-linux-arm64"
          if aws s3api head-object --bucket "$BUCKET" --key "$key" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists; releases are immutable."
            exit 1
          fi
          sha=$(sha256sum bin/hearth-agent | cut -d' ' -f1)
          aws s3 cp --only-show-errors bin/hearth-agent "s3://$BUCKET/$key"
          printf '%s' "$sha" | aws s3 cp --only-show-errors - "s3://$BUCKET/$key.sha256"
          release=$(jq -nc --arg v "$VERSION" --arg s "$sha" '{version: $v, sha256: $s}')
          aws ssm put-parameter --name /hearth/dev/agent/canary --type String --overwrite --value "$release" >/dev/null
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - name: Tag and GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.upload.outputs.sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Not "Latest": that marks what prod runs (Promote release).
          gh release create "agent-$VERSION" --target "$GITHUB_SHA" --title "Agent $VERSION" --latest=false --notes \
            "Agent release \`$VERSION\` (sha256 \`$SHA256\`), on dev's canary. Promote it with **Promote agent**, version \`$VERSION\`."
          {
            echo "## Agent $VERSION released"
            echo
            echo "sha256 \`$SHA256\` · tag \`agent-$VERSION\` · **dev canary → $VERSION**"
            echo
            echo "Next: **Promote agent** with version \`$VERSION\` to put it on another channel or environment."
          } >> "$GITHUB_STEP_SUMMARY"
      # Keeps every channel's current release and its previous two, plus the newest five.
      - name: Prune old releases
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-agent-releases.sh
