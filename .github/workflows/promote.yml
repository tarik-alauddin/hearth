name: Promote

# Moves a release on, dev → stage → prod. Two kinds, both published by Deploy:
#   - platform (v2026.10.07-3f2a9c1): deploys the cloud assembly attached to the release (the
#     one dev got, never a rebuild). History: aws ssm get-parameter-history --name /hearth/<env>/release
#   - agent (agent-2026.10.07-3f2a9c1): points a channel at it; servers on that channel run it from
#     their next start. History: aws ssm get-parameter-history --name /hearth/<env>/agent/<channel>
# Blank version = the previous environment's: platform stage = the newest release, prod = stage's;
# agent stable dev = dev's canary, stage = dev's stable, prod = stage's stable. Prod only takes
# what stage has run. Rolling back = promoting an older version.
on:
  workflow_dispatch:
    inputs:
      what:
        description: What to promote
        type: choice
        options: [platform, agent]
        required: true
      env:
        description: Environment
        type: choice
        options: [stage, prod, dev]
        required: true
      channel:
        description: Agent channel (agent only)
        type: choice
        options: [stable, canary]
        default: stable
      version:
        description: From the Releases page (v… platform, agent-… agent). Blank = the previous environment's.
        required: false

permissions:
  contents: read

concurrency:
  group: promote-${{ inputs.what }}-${{ inputs.env }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT: "138300868928"
  BUCKET: hearth-agent-releases-138300868928

jobs:
  # Platform: find the release and its assembly; deploy runs next.
  resolve:
    if: inputs.what == 'platform'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # "Run workflow" offers a branch picker (which copy of this file runs); only main's may run.
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main, not ${GITHUB_REF_NAME}."
          exit 1
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT }}:role/github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Which release
        id: version
        env:
          TARGET_ENV: ${{ inputs.env }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current() { aws ssm get-parameter --name "/hearth/$1/release" --query Parameter.Value --output text 2>/dev/null || true; }
          newest() { gh release list --limit 100 --json tagName --jq '[.[].tagName | select(startswith("v"))][0] // ""'; }

          if [ -z "$VERSION" ]; then
            case "$TARGET_ENV" in
              prod) VERSION=$(current stage) ;;
              *) VERSION=$(newest) ;;
            esac
            [ -n "$VERSION" ] || { echo "::error::Nothing to promote: give a version."; exit 1; }
          fi
          if [[ "$VERSION" == agent-* ]]; then
            echo "::error::$VERSION is an agent release: choose \"agent\". The newest platform release is $(newest)."
            exit 1
          fi
          VERSION=v${VERSION#v} # accept it without the v too
          [[ "$VERSION" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]{7}$ ]] \
            || { echo "::error::Invalid platform release: $VERSION (expected e.g. v2026.10.07-3f2a9c1)"; exit 1; }
          if [ "$TARGET_ENV" = prod ] && ! aws ssm get-parameter-history --name /hearth/stage/release \
              --query 'Parameters[].Value' --output text 2>/dev/null | tr '\t' '\n' | grep -qx "$VERSION"; then
            echo "::error::$VERSION has never run on stage. Promote it to stage first (stage runs $(current stage))."
            exit 1
          fi
          if ! gh release download "$VERSION" --pattern cloud-assembly.zip; then
            if gh release view "agent-${VERSION#v}" >/dev/null 2>&1; then
              echo "::error::agent-${VERSION#v} is an agent release: choose \"agent\". The newest platform release is $(newest)."
            else
              echo "::error::No platform release $VERSION with a cloud assembly. The newest is $(newest)."
            fi
            exit 1
          fi
          mkdir cdk.out
          unzip -q cloud-assembly.zip -d cdk.out
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: cloud-assembly
          path: cdk.out
          retention-days: 7

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    # Required reviewers on the prod environment gate prod promotions.
    environment: ${{ inputs.env }}
    concurrency:
      group: deploy-${{ inputs.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.version }}
      - uses: ./.github/actions/deploy
        with:
          env: ${{ inputs.env }}
          stacks: hearth-${{ inputs.env }}-*
          version: ${{ needs.resolve.outputs.version }}

  # The Releases page's "Latest" is what prod runs.
  mark-latest:
    if: inputs.env == 'prod'
    needs: [resolve, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark the release as prod's
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$VERSION" --prerelease=false --latest

  agent:
    if: inputs.what == 'agent'
    runs-on: ubuntu-latest
    # Required reviewers on the prod environment gate prod promotions.
    environment: ${{ inputs.env }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main, not ${GITHUB_REF_NAME}."
          exit 1
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT }}:role/github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Point the channel at the release
        env:
          TARGET_ENV: ${{ inputs.env }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          param() { aws ssm get-parameter --name "/hearth/$1/agent/$2" --query Parameter.Value --output text 2>/dev/null || true; }
          newest() {
            aws s3api list-objects-v2 --bucket "$BUCKET" --prefix agent/ \
              --query "Contents[?ends_with(Key, '/hearth-agent-linux-arm64')].[LastModified,Key]" --output text |
              sort | tail -n 1 | cut -f2 | cut -d/ -f2
          }

          if [ -z "$VERSION" ]; then
            [ "$CHANNEL" = stable ] || { echo "::error::Give a version to put on canary. The newest agent release is $(newest)."; exit 1; }
            case "$TARGET_ENV" in
              dev) from="dev canary"; target=$(param dev canary) ;;
              stage) from="dev stable"; target=$(param dev stable) ;;
              prod) from="stage stable"; target=$(param stage stable) ;;
            esac
            [ -n "$target" ] || { echo "::error::$from has no agent release to promote."; exit 1; }
          else
            if [[ "$VERSION" == v* ]]; then
              echo "::error::$VERSION is a platform release: choose \"platform\". The newest agent release is $(newest)."
              exit 1
            fi
            VERSION=${VERSION#agent-} # accept the tag name too
            [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]{7}$ ]] \
              || { echo "::error::Invalid agent release: $VERSION (expected e.g. agent-2026.10.07-3f2a9c1)"; exit 1; }
            if ! sha=$(aws s3 cp "s3://$BUCKET/agent/$VERSION/hearth-agent-linux-arm64.sha256" - 2>/dev/null); then
              if aws ssm get-parameter-history --name /hearth/dev/release --query 'Parameters[].Value' --output text 2>/dev/null | tr '\t' '\n' | grep -qx "v$VERSION"; then
                echo "::error::v$VERSION is a platform release: choose \"platform\". The newest agent release is $(newest)."
              else
                echo "::error::No agent release $VERSION. The newest is $(newest)."
              fi
              exit 1
            fi
            target=$(jq -nc --arg v "$VERSION" --arg s "$sha" '{version: $v, sha256: $s}')
          fi
          version=$(jq -r .version <<<"$target")
          aws s3api head-object --bucket "$BUCKET" --key "agent/$version/hearth-agent-linux-arm64" >/dev/null \
            || { echo "::error::Release $version has no binary in $BUCKET"; exit 1; }
          if [ "$TARGET_ENV" = prod ] && ! aws ssm get-parameter-history --name /hearth/stage/agent/stable \
              --query 'Parameters[].Value' --output json 2>/dev/null | jq -r '.[] | fromjson | .version' | grep -qx "$version"; then
            echo "::error::Agent $version has never been stage's stable. Promote it there first."
            exit 1
          fi

          previous=$(param "$TARGET_ENV" "$CHANNEL")
          aws ssm put-parameter --name "/hearth/$TARGET_ENV/agent/$CHANNEL" --type String --overwrite --value "$target" >/dev/null

          from=$(jq -r '.version // "none"' <<<"${previous:-{\}}")
          {
            echo "## Agent promoted: $TARGET_ENV $CHANNEL"
            echo
            echo "**$from → $version** (sha256 \`$(jq -r .sha256 <<<"$target")\`)"
            echo
            echo "Servers on $CHANNEL in $TARGET_ENV run it from their next start. To roll back, promote version \`$from\`."
          } >> "$GITHUB_STEP_SUMMARY"
