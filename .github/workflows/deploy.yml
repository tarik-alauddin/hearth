name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT: "138300868928"
  # Version stamped into the agent binary that synth builds.
  HEARTH_AGENT_VERSION: ${{ github.sha }}

jobs:
  # Synthesize every environment once; later jobs deploy this same assembly.
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm synth
      - uses: actions/upload-artifact@v7
        with:
          name: cloud-assembly
          path: infra/cdk.out
          retention-days: 30

  deploy-dev:
    needs: synth
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: cloud-assembly
          path: infra/cdk.out
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT }}:role/github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: cdk deploy
        working-directory: infra
        run: pnpm exec cdk deploy --app cdk.out 'hearth-dev-*' --require-approval never --concurrency 4

  # deploy-stage (+ E2E) and deploy-prod (with approval) are added once there is something to test.
