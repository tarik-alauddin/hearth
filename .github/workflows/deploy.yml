name: Deploy

# Every merge to main deploys dev and publishes one release, v<date>-<sha7> (e.g.
# v2026.10.07-3f2a9c1), carrying:
#   - cloud-assembly.zip: the cloud assembly dev got;
#   - release.json: the agent that goes with it. When agent/ changed since the newest agent build,
#     a new agent is built (harness-tested, uploaded to the releases bucket, put on dev's canary);
#     otherwise it's that newest build.
# "Promote" then deploys the release to stage and prod (each env's agent canary too), and moves an
# env's agent from canary to stable. Run by hand to try a branch on dev (no agent, no release; pause
# merges to main while dev runs it, or the next merge replaces it).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, so each release's agent is the newest build at its commit. A run waiting
# behind another may be replaced by a newer one; the newer run covers its changes (agent changes
# are found against the newest agent build, release notes against the previous release).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT: "138300868928"
  BUCKET: hearth-agent-releases-138300868928

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      build-agent: ${{ steps.plan.outputs.build-agent }}
      newest-agent: ${{ steps.plan.outputs.newest-agent }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to compare with the newest agent build's commit
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT }}:role/github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Agent
        id: plan
        run: |
          set -euo pipefail
          newest=$(bash scripts/newest-agent-release.sh)
          echo "newest-agent=$newest" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            echo build-agent=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Versions end in their commit (2026.10.07-3f2a9c1). No build yet, or its commit unknown: build.
          sha=$(jq -r '.version // "" | sub("^.*-"; "")' <<<"$newest")
          if [ -n "$sha" ] && commit=$(git rev-parse -q --verify "$sha^{commit}") \
              && git diff --quiet "$commit" "$GITHUB_SHA" -- agent/; then
            echo build-agent=false >> "$GITHUB_OUTPUT"
            echo "Agent unchanged since $(jq -r .version <<<"$newest")."
          else
            echo build-agent=true >> "$GITHUB_OUTPUT"
          fi

  # Synthesize every environment once; dev, stage and prod all deploy this same assembly.
  synth:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "version=v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$GITHUB_REF_NAME@${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm test
      - name: Test summary
        if: ${{ !cancelled() }}
        run: node scripts/test-summary.mjs
        env:
          SUMMARY_SHA: ${{ github.sha }}
      - run: pnpm synth
      - uses: actions/upload-artifact@v7
        with:
          name: cloud-assembly
          path: infra/cdk.out
          retention-days: 30

  deploy-dev:
    needs: synth
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/deploy
        with:
          env: dev
          # Account-wide resources (the budget) go with dev.
          stacks: hearth-dev-* hearth-account
          version: ${{ needs.synth.outputs.version }}

  agent:
    needs: plan
    if: needs.plan.outputs.build-agent == 'true'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    outputs:
      release: ${{ steps.upload.outputs.release }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Version
        id: version
        run: echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - run: go vet -tags harness ./...
      - run: go test -race ./...
      - name: Harness (real agent, Minecraft container, mock API)
        run: go test -tags harness -timeout 30m ./harness/
      - name: Build
        run: ./build.sh "${{ steps.version.outputs.version }}"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT }}:role/github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload and point dev's canary at it
        id: upload
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          key="agent/$VERSION/hearth-agent-linux-arm64"
          if aws s3api head-object --bucket "$BUCKET" --key "$key" >/dev/null 2>&1; then
            echo "::error::Agent $VERSION already exists; releases are immutable."
            exit 1
          fi
          sha=$(sha256sum bin/hearth-agent | cut -d' ' -f1)
          aws s3 cp --only-show-errors bin/hearth-agent "s3://$BUCKET/$key"
          printf '%s' "$sha" | aws s3 cp --only-show-errors - "s3://$BUCKET/$key.sha256"
          release=$(jq -nc --arg v "$VERSION" --arg s "$sha" '{version: $v, sha256: $s}')
          aws ssm put-parameter --name /hearth/dev/agent/canary --type String --overwrite --value "$release" >/dev/null
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "## Agent $VERSION built: dev canary → $VERSION" >> "$GITHUB_STEP_SUMMARY"
      # Keeps every channel's current agent and its previous two, plus the newest five.
      - name: Prune old agents
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-agent-releases.sh

  # Only once dev has it (and the agent, if one was built): a release is something that deployed.
  release:
    needs: [plan, synth, deploy-dev, agent]
    if: >-
      always() && github.event_name == 'push' && needs.deploy-dev.result == 'success'
      && (needs.agent.result == 'success' || needs.agent.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cloud-assembly
          path: cdk.out
      - name: Publish the release
        env:
          VERSION: ${{ needs.synth.outputs.version }}
          BUILT: ${{ needs.agent.outputs.release }}
          NEWEST: ${{ needs.plan.outputs.newest-agent }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          agent=${BUILT:-$NEWEST}
          [ -n "$agent" ] && [ "$agent" != null ] || { echo "::error::No agent build to release with."; exit 1; }
          agent_version=$(jq -r .version <<<"$agent")
          jq -n --arg v "$VERSION" --argjson a "$agent" '{version: $v, agent: $a}' > release.json
          (cd cdk.out && zip -qr ../cloud-assembly.zip .)
          if [ -n "$BUILT" ]; then note="new in this release, on dev's canary"; else note="unchanged"; fi
          # Notes since the previous release (older agent-only releases are tagged agent-…).
          previous=$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(startswith("v"))][0] // ""')
          gh release create "$VERSION" cloud-assembly.zip release.json --target "$GITHUB_SHA" --prerelease \
            --title "Hearth $VERSION" --notes "Agent \`$agent_version\` ($note)." \
            --generate-notes ${previous:+--notes-start-tag "$previous"}
          {
            echo "## Released $VERSION (on dev), agent $agent_version ($note)"
            echo
            echo "Next: **Promote** it to stage, then prod."
          } >> "$GITHUB_STEP_SUMMARY"
