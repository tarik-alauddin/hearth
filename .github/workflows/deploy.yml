name: Deploy

# Dev only: every merge to main. Run by hand to try a branch on dev (pause merges to main while
# dev runs it, or the next merge replaces it). Stage and prod deploy only from a GitHub Release
# (release.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Synthesize every environment once; the deploy job deploys this same assembly.
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test
      - name: Test summary
        if: ${{ !cancelled() }}
        run: node scripts/test-summary.mjs
        env:
          SUMMARY_SHA: ${{ github.sha }}
      - run: pnpm synth
      - uses: actions/upload-artifact@v7
        with:
          name: cloud-assembly
          path: infra/cdk.out
          retention-days: 30

  deploy-dev:
    needs: synth
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-env.yml
    with:
      env: dev
      # Account-wide resources (the budget) go with dev.
      stacks: hearth-dev-* hearth-account
