name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT: "138300868928"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - name: shellcheck
        run: shellcheck infra/lib/user-data/*.sh infra/test/user-data/*.sh agent/*.sh scripts/*.sh scripts/test/*.sh
      - name: Release pruning test
        run: bash scripts/test/prune-agent-releases-test.sh
      - run: pnpm typecheck
      - name: Build the web app
        run: pnpm --filter @hearth/web build
      # Unit tests and CDK assertions; cdk-nag runs inside every synth.
      - run: pnpm test
      - name: Test summary
        if: ${{ !cancelled() }}
        run: node scripts/test-summary.mjs
        env:
          SUMMARY_SHA: ${{ github.event.pull_request.head.sha }}
      - run: pnpm synth

  user-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Runs the instance startup script against a loop device in a privileged container.
      - run: bash infra/test/user-data/run.sh

  # The real agent, a real Minecraft server and a mock API (see agent/harness).
  agent-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go test -tags harness -timeout 25m -v ./harness/

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet -tags harness ./...
      - run: go test -race ./...
      - name: Build for game instances (linux/arm64)
        run: ./build.sh "${GITHUB_SHA::7}"

  diff:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT }}:role/github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: cdk diff against dev
        working-directory: infra
        run: |
          pnpm exec cdk diff 'hearth-dev-*' -c env=dev --no-color 2>&1 | tee ../diff.txt
          exit "${PIPESTATUS[0]}"
      - name: Post diff to the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### `cdk diff` (dev)'
            echo '```'
            head -c 60000 diff.txt
            echo '```'
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file comment.md
